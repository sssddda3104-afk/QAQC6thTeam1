[theme]
# 팀원이 저번 프로젝트에서 쓴 참고 대시보드(흰 배경 + 옅은 그림자 카드 + 초록 포인트
# 컬러)를 보고 전체 라이트 테마로 전환 확정(2026-09 수정). 기존 다크+메탈릭그린 톤은 폐기.
base = "light"
primaryColor = "#059669"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7f6"
textColor = "#1a2420"
font = "sans serif"

[client]
# 표(st.dataframe)에서 CSV 내보내기·클립보드 복사 기능을 끈다.
# 기본 제공되는 열 크기 조절 / 헤더 클릭 정렬 기능만 남긴다.
disableDataExport = true
